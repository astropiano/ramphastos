name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build
        run: dotnet build Ramphastos.slnx -c Release

      - name: Test
        run: dotnet test src/Ramphastos.Core.Facts -c Release

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build all workspaces
        run: |
          npm ci
          npm run build --workspaces --if-present
