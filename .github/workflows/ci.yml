name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ramphastos

      # Ramphastos.Core consumes TotalSerializer via a local sibling feed
      # (nuget.config -> ../totalserializer/packages-local) until the
      # packages are published to nuget.org.
      - uses: actions/checkout@v4
        with:
          repository: astropiano/totalserializer
          path: totalserializer
          token: ${{ secrets.CI_PAT || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Pack TotalSerializer into the local feed
        run: dotnet pack totalserializer -c Release -o totalserializer/packages-local

      - name: Build
        run: dotnet build ramphastos/Ramphastos.slnx -c Release

      - name: Test
        run: dotnet test ramphastos/src/Ramphastos.Core.Facts -c Release

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build all workspaces
        run: |
          npm ci
          npm run build --workspaces --if-present
