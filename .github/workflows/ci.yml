name: ci

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build
        run: dotnet build Ramphastos.slnx -c Release

      - name: Test
        run: dotnet test src/Ramphastos.Core.Facts -c Release

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build all workspaces
        run: |
          npm ci
          npm run build --workspaces --if-present

  # Tag a release with `git tag vX.Y.Z && git push --tags` — the tag name is
  # the version for both NuGet and npm packages.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dotnet, client]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for NuGet Trusted Publishing (OIDC)
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Pack NuGet packages
        run: dotnet pack Ramphastos.slnx -c Release -o packages-out -p:Version=${VERSION#v}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages-out/*.nupkg

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: alexander_timmermans

      - name: Publish to nuget.org
        run: dotnet nuget push "packages-out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Version client packages from tag and publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm pkg set "dependencies.ramphastos-client=^${VERSION#v}" --workspace ramphastos-react
          npm version ${VERSION#v} --workspace ramphastos-client --workspace ramphastos-react --no-git-tag-version
          npm publish --workspace ramphastos-client --workspace ramphastos-react --access public --provenance
